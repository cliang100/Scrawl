<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrawl - Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/lobby-overlay.css">
</head>
<body>
    <!-- Game Title -->
     <h1 class="game-title">Scrawl</h1>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="game-meta">
            <div class="meta-left">
                <span id="timer" class="timer">80s</span>
                <span id="roundDisplay" class="round-display">Round 1 of 3</span>
            </div>
            <div id="wordDisplay" class="word-display-center">
                <div class="word-container">
                    <span class="word-label"></span>
                    <span class="letter-count"></span>
                    <span class="word-content"></span>
                </div>
            </div>
            <div class="settings-icon">⚙️</div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="game-layout">
        <!-- Left: Players -->
        <div class="left-sidebar">
            <div id="gamePlayerList"></div>
        </div>

        <!-- Center: Canvas Area -->
        <div class="center-column">
            <canvas id="drawingCanvas"></canvas>
            
            <!-- Lobby Overlay -->
            <div id="lobbyOverlay">
                <div class="lobby-room-code" id="lobbyRoomCode">ROOM</div>
                
                <div class="lobby-settings">
                    <div class="settings-title">Game Settings</div>
                    
                    <div class="setting-row">
                        <span class="setting-label">Rounds</span>
                        <div class="dropdown" id="roundsDropdown">
                            <div class="dropdown-value" id="roundsValue">3</div>
                            <div class="dropdown-menu hidden">
                                <div class="dropdown-item" data-value="1">1</div>
                                <div class="dropdown-item" data-value="2">2</div>
                                <div class="dropdown-item" data-value="3">3</div>
                                <div class="dropdown-item" data-value="4">4</div>
                                <div class="dropdown-item" data-value="5">5</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="setting-row">
                        <span class="setting-label">Draw Time</span>
                        <div class="dropdown" id="drawTimeDropdown">
                            <div class="dropdown-value" id="drawTimeValue">80s</div>
                            <div class="dropdown-menu hidden">
                                <div class="dropdown-item" data-value="30">30s</div>
                                <div class="dropdown-item" data-value="40">40s</div>
                                <div class="dropdown-item" data-value="60">60s</div>
                                <div class="dropdown-item" data-value="80">80s</div>
                                <div class="dropdown-item" data-value="100">100s</div>
                                <div class="dropdown-item" data-value="120">120s</div>
                                <div class="dropdown-item" data-value="150">150s</div>
                                <div class="dropdown-item" data-value="180">180s</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="lobby-actions">
                    <button class="lobby-btn lobby-btn-primary" id="startGameBtn">
                        <span>▶</span> Start Game
                    </button>
                    <button class="lobby-btn lobby-btn-secondary" id="copyCodeBtn">
                        <span>🔗</span> Invite
                    </button>
                </div>
                
                <div class="waiting-message" id="waitingMessage" style="display: none;">
                    Waiting for host to start...
                </div>
            </div>
            
            <div class="toolbar">
                <div class="color-palette">
                    <div class="color-row">
                        <div class="color-option" data-color="#FFFFFF" style="background: #FFFFFF;"></div>
                        <div class="color-option" data-color="#C1C1C1" style="background: #C1C1C1;"></div>
                        <div class="color-option" data-color="#FF6B6B" style="background: #FF6B6B;"></div>
                        <div class="color-option" data-color="#FF9F43" style="background: #FF9F43;"></div>
                        <div class="color-option" data-color="#FFE66D" style="background: #FFE66D;"></div>
                        <div class="color-option" data-color="#4ECDC4" style="background: #4ECDC4;"></div>
                        <div class="color-option" data-color="#95E1D3" style="background: #95E1D3;"></div>
                        <div class="color-option" data-color="#74B9FF" style="background: #74B9FF;"></div>
                        <div class="color-option" data-color="#0984E3" style="background: #0984E3;"></div>
                        <div class="color-option" data-color="#A29BFE" style="background: #A29BFE;"></div>
                        <div class="color-option" data-color="#FD79A8" style="background: #FD79A8;"></div>
                        <div class="color-option" data-color="#F5DEB3" style="background: #F5DEB3;"></div>
                        <div class="color-option" data-color="#8B4513" style="background: #8B4513;"></div>
                    </div>
                    <div class="color-row">
                        <div class="color-option" data-color="#000000" style="background: #000000;"></div>
                        <div class="color-option" data-color="#636E72" style="background: #636E72;"></div>
                        <div class="color-option" data-color="#C0392B" style="background: #C0392B;"></div>
                        <div class="color-option" data-color="#E67E22" style="background: #E67E22;"></div>
                        <div class="color-option" data-color="#F1C40F" style="background: #F1C40F;"></div>
                        <div class="color-option" data-color="#27AE60" style="background: #27AE60;"></div>
                        <div class="color-option" data-color="#16A085" style="background: #16A085;"></div>
                        <div class="color-option" data-color="#2980B9" style="background: #2980B9;"></div>
                        <div class="color-option" data-color="#2C3E50" style="background: #2C3E50;"></div>
                        <div class="color-option" data-color="#8E44AD" style="background: #8E44AD;"></div>
                        <div class="color-option" data-color="#C2185B" style="background: #C2185B;"></div>
                        <div class="color-option" data-color="#8D6E63" style="background: #8D6E63;"></div>
                        <div class="color-option" data-color="#4A2C2A" style="background: #4A2C2A;"></div>
                    </div>
                </div>
                <div class="brush-picker">
                    <button class="brush-trigger" id="brushTrigger" title="Brush Size">
                        <span class="brush-icon"></span>
                    </button>
                    <div class="brush-options drop-up">
                        <div class="brush-option" data-size="2" title="Thin">
                            <div class="brush-preview" style="width: 4px; height: 4px;"></div>
                        </div>
                        <div class="brush-option selected" data-size="5" title="Medium-Thin">
                            <div class="brush-preview" style="width: 8px; height: 8px;"></div>
                        </div>
                        <div class="brush-option" data-size="10" title="Medium">
                            <div class="brush-preview" style="width: 14px; height: 14px;"></div>
                        </div>
                        <div class="brush-option" data-size="15" title="Thick">
                            <div class="brush-preview" style="width: 20px; height: 20px;"></div>
                        </div>
                        <div class="brush-option" data-size="20" title="Massive">
                            <div class="brush-preview" style="width: 26px; height: 26px;"></div>
                        </div>
                    </div>
                </div>
                <button id="penTool" class="tool-btn selected" title="Pen">
                    <img src="/static/images/pencil.png" alt="Pen">
                </button>
                <button id="fillTool" class="tool-btn" title="Fill">
                    <img src="/static/images/fill.png" alt="Fill">
                </button>
                <button id="undoStroke" title="Undo">
                        <img src="/static/images/undo.png" alt="Undo">
                    </button>
                    <button id="clearCanvas" title="Clear">
                        <img src="/static/images/trash.png" alt="Clear">
                    </button>
            </div>
        </div>

        <!-- Right: Chat -->
        <div class="right-sidebar">
            <div class="chat-container">
                <div class="message-list" id="messageList">
                    <!-- Messages go here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="guessInput" placeholder="Type your guess here...">
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.js"></script>
    <script src="/static/js/canvas.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
