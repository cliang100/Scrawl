<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrawl - Game</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Game Title -->
     <h1 class="game-title">Scrawl</h1>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="game-meta">
            <div class="meta-left">
                <span id="timer" class="timer">80s</span>
                <span id="roundDisplay" class="round-display">Round 1 of 3</span>
            </div>
            <span id="turnStatus" class="turn-status-center">Waiting...</span>
            <span id="wordDisplay" class="word-display-center"></span>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="game-layout">
        <!-- Left: Players -->
        <div class="left-sidebar">
            <h3>Players</h3>
            <ul id="gamePlayerList"></ul>
            <div class="score-section" id="scoreDisplay"></div>
        </div>

        <!-- Center: Canvas Area -->
        <div class="center-column">
            <canvas id="drawingCanvas"></canvas>
            <div class="toolbar">
                <input type="color" id="colorPicker" value="#000000" title="Color">
                <input type="range" id="brushSize" min="1" max="20" value="2" title="Size">
                <span id="sizeDisplay">2</span>
                <button id="clearCanvas" title="Clear">🗑</button>
            </div>
        </div>

        <!-- Right: Chat -->
        <div class="right-sidebar">
            <div class="chat-container">
                <div class="message-list" id="messageList">
                    <!-- Messages go here -->
                </div>
                <div class="chat-input">
                    <input type="text" id="guessInput" placeholder="Type your guess...">
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/socket.js"></script>
    <script src="/static/js/canvas.js"></script>
    <script src="/static/js/game.js"></script>
</body>
</html>
