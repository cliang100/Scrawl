name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # latest patch release, so standard library fixes are picked up
          go-version: "1.26.x"
          check-latest: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Check JavaScript syntax
        run: for f in web/static/js/*.js; do node --check "$f"; done
      - run: docker build -t scrawl .
